  <text x="254" y="94" font-family="Consolas, monospace" font-size="12" fill="#e9eff8">CORE-R1</text>
  <text x="243" y="113" font-family="Consolas, monospace" font-size="9" fill="#7f93ad">CISCO IOS · ABR</text>

